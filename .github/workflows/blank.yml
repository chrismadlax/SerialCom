name: Build LabVIEW Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}         # 保留手動觸發能力

jobs:
  build:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run LabVIEW CLI to Build Executable
        run:  LabVIEWCLI -OperationName ExecuteBuildSpec -ProjectPath "C:\Users\chris\Documents\LabVIEW Data\Project\SerialCom\SerialCommPrj.lvproj"

      - uses: actions/upload-artifact@v7
        with:
          name: LabVIEW Execuable File
          path: C:\Users\chris\Documents\LabVIEW Data\Project\builds\SerialCommPrj\SimpleSerial
