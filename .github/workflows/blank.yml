name: Build LabVIEW Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}         # 保留手動觸發能力

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run LabVIEW CLI to Build Executable
        shell: cmd
        run:  LabVIEWCLI -OperationName ExecuteBuildSpec -ProjectPath "C:\Users\chris\Documents\LabVIEW Data\Project\SerialCom\SerialCommPrj.lvproj"

      - name: generate date string
        id: date
        shell: pwsh
        run: echo "value=$(Get-Date -Format 'yyyyMMdd_HHmm')" >> $env:GITHUB_OUTPUT
        
      - uses: actions/upload-artifact@v7
        with:
          name: LabVIEW_Executable_${{ steps.date.outputs.value }}_build${{ github.run_number }}
          path: C:\Users\chris\Documents\LabVIEW Data\Project\builds\SerialCommPrj\SimpleSerial
